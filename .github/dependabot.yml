version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # OmegaConf 2.3.1 requires antlr4-python3-runtime==4.9.*.
      - dependency-name: antlr4-python3-runtime
        versions: [">=4.10"]
