name: Предложение функции — русский
description: Предложите улучшение проекта без публикации личных материалов.
title: "[Предложение] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Проверьте конфиденциальность перед отправкой:** описывайте задачу на вымышленных примерах. Не прикладывайте настоящие субтитры, записи, журналы, снимки с личными данными, учётные данные или пути, по которым можно определить владельца.
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему нужно решить?
      description: Используйте только вымышленные примеры и удалите личную информацию.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Какое поведение вы предлагаете?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка конфиденциальности
      options:
        - label: Я проверил, что в предложении нет личных данных, приватных записей, настоящего текста субтитров, учётных данных и идентифицирующих путей.
          required: true
