name: Bug report
description: Report a reproducible problem using synthetic or redacted examples.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy check before submitting:** remove real names, private subtitles, audio/video, logs, absolute file paths, usernames, email addresses, and machine-specific voice/model details. Use synthetic files and text only. Do not attach lecture materials or recordings.
  - type: input
    id: version
    attributes:
      label: App version
      description: The version shown by the app or release notes.
      placeholder: 3.5.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac type
      placeholder: macOS version; Apple silicon model family
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a synthetic subtitle example. Do not include real or private content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Redact paths and personal details from any error text.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I checked that this report and its attachments contain no personal data, private recordings, real subtitle content, credentials, or identifying paths.
          required: true
